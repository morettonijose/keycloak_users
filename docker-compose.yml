version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HTTP_RELATIVE_PATH=/
      - KC_HTTP_CORS=true
      - KC_SPI_THEME_CACHE_THEMES=false
      - KC_SPI_THEME_CACHE_TEMPLATES=false
      - KC_SPI_CORS_ALLOWED_ORIGINS=http://localhost:8000,http://localhost:8001
    ports:
      - "8080:8080"
    command:
      - start-dev
    networks:
      - mvp_network

  db-users:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=userdb
    ports:
      - "5432:5432"
    networks:
      - mvp_network

  db-notifications:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=notificationsdb
    ports:
      - "5433:5432"
    networks:
      - mvp_network

  api-users:
    build: ./api-users
    depends_on:
      - db-users
      - keycloak
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db-users:5432/userdb
    networks:
      - mvp_network
    command: >
      sh -c "apt-get update && apt-get install -y netcat-openbsd && 
             while ! nc -z db-users 5432; do sleep 1; done && 
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  api-notifications:
    build: ./api-notifications
    depends_on:
      - db-notifications
      - keycloak
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://user:password@db-notifications:5432/notificationsdb
    networks:
      - mvp_network
    command: >
      sh -c "apt-get update && apt-get install -y netcat-openbsd && 
             while ! nc -z db-notifications 5432; do sleep 1; done && 
             uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"

# rede interna
networks:
  mvp_network:
    driver: bridge
